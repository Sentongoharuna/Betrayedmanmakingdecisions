name: DU Device Adapt Fresh R1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build DU Device Adapt APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create fresh Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/du/deviceadapt
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DUDeviceAdapt"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.du.deviceadapt'
              compileSdk 35

              defaultConfig {
                  applicationId "com.du.deviceadapt"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "1.0-R1"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.camera.any"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="DU Device Adapt"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:navigationBarColor">#090B10</item>
                  <item name="android:statusBarColor">#090B10</item>
                  <item name="android:windowBackground">#090B10</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090B10">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="DU DEVICE ADAPT"
                      android:textColor="#FFFFFF"
                      android:textSize="28sp"
                      android:textStyle="bold"/>

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="LIVE HARDWARE ADAPTATION ENGINE"
                      android:textColor="#AEB7C7"
                      android:textSize="12sp"
                      android:layout_marginTop="4dp"
                      android:layout_marginBottom="18dp"/>

                  <TextView
                      android:id="@+id/tier"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="ANALYSING DEVICE..."
                      android:textColor="#FFFFFF"
                      android:textSize="22sp"
                      android:textStyle="bold"
                      android:padding="16dp"
                      android:background="#171B24"/>

                  <TextView
                      android:id="@+id/report"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:textColor="#D8DCE5"
                      android:textSize="15sp"
                      android:lineSpacingExtra="5dp"
                      android:layout_marginTop="14dp"/>

                  <Button
                      android:id="@+id/rescan"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="RESCAN DEVICE"
                      android:layout_marginTop="20dp"/>

              </LinearLayout>

          </ScrollView>
          EOF

          cat > app/src/main/java/com/du/deviceadapt/MainActivity.java <<'EOF'
          package com.du.deviceadapt;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.MediaCodecInfo;
          import android.media.MediaCodecList;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.widget.Button;
          import android.widget.TextView;

          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextView tierView;
              private TextView reportView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
